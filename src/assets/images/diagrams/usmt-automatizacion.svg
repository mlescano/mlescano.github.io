<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagrama de despliegue automatico de PCs con USMT">
  <rect width="800" height="450" rx="16" fill="#161c26"/>
  <rect width="800" height="50" rx="16" fill="#10141b"/>
  <rect y="34" width="800" height="16" fill="#10141b"/>
  <circle cx="30" cy="25" r="7" fill="#ff5f56"/>
  <circle cx="54" cy="25" r="7" fill="#ffbd2e"/>
  <circle cx="78" cy="25" r="7" fill="#27c93f"/>
  <rect x="150" y="18" width="200" height="14" rx="7" fill="#242c39"/>

  <!-- old laptop -->
  <g transform="translate(110,170)">
    <rect width="140" height="90" rx="8" fill="#1c232f" stroke="#38424f"/>
    <rect x="-10" y="90" width="160" height="12" rx="4" fill="#1c232f" stroke="#38424f"/>
    <rect x="16" y="20" width="108" height="50" rx="3" fill="#242c39"/>
  </g>

  <!-- dashed arrow with gear -->
  <path d="M 270 215 H 480" stroke="#8ace25" stroke-width="3" stroke-dasharray="6 6" fill="none" marker-end="url(#a)"/>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8ace25"/>
    </marker>
  </defs>
  <g transform="translate(375,160)" stroke="#ff7a33" stroke-width="3" fill="none">
    <circle r="22"/>
    <path d="M0 -30 v10 M0 20 v10 M-30 0 h10 M20 0 h10 M-21 -21 l7 7 M14 14 l7 7 M-21 21 l7 -7 M14 -14 l7 -7"/>
  </g>

  <!-- new laptop -->
  <g transform="translate(540,170)">
    <rect width="140" height="90" rx="8" fill="#1c232f" stroke="#8ace25"/>
    <rect x="-10" y="90" width="160" height="12" rx="4" fill="#1c232f" stroke="#38424f"/>
    <rect x="16" y="20" width="108" height="50" rx="3" fill="#242c39"/>
    <path d="M40 45 l18 18 l40 -40" stroke="#8ace25" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- progress bar -->
  <rect x="150" y="330" width="500" height="14" rx="7" fill="#242c39"/>
  <rect x="150" y="330" width="340" height="14" rx="7" fill="#8ace25"/>
</svg>
