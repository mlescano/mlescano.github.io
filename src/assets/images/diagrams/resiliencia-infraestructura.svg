<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagrama de resiliencia de infraestructura critica">
  <rect width="800" height="450" rx="16" fill="#161c26"/>
  <rect width="800" height="50" rx="16" fill="#10141b"/>
  <rect y="34" width="800" height="16" fill="#10141b"/>
  <circle cx="30" cy="25" r="7" fill="#ff5f56"/>
  <circle cx="54" cy="25" r="7" fill="#ffbd2e"/>
  <circle cx="78" cy="25" r="7" fill="#27c93f"/>
  <rect x="150" y="18" width="200" height="14" rx="7" fill="#242c39"/>

  <!-- shield -->
  <g transform="translate(330,110)">
    <path d="M70 0 L140 24 V110 C140 160 110 190 70 210 C30 190 0 160 0 110 V24 Z" fill="#1c232f" stroke="#8ace25" stroke-width="3"/>
    <path d="M38 105 L60 128 L104 76" stroke="#8ace25" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

