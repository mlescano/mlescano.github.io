  </g>

  <!-- UPS / battery icon right -->
  <g transform="translate(620,330)" stroke="#ff7a33" stroke-width="3" fill="none">
    <rect x="-40" y="-25" width="80" height="50" rx="6"/>
    <rect x="40" y="-10" width="8" height="20" fill="#ff7a33" stroke="none"/>
    <path d="M-10 -12 L2 0 L-6 0 L8 14" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <path d="M 190 330 H 290" stroke="#38424f" stroke-width="2" stroke-dasharray="4 5"/>
  <path d="M 470 330 H 570" stroke="#38424f" stroke-width="2" stroke-dasharray="4 5"/>
