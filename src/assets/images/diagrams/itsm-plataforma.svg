<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagrama de plataforma ITSM/CRM interna con dashboard y reportes">
  <rect width="800" height="450" rx="16" fill="#161c26"/>
  <rect width="800" height="50" rx="16" fill="#10141b"/>
  <rect y="34" width="800" height="16" fill="#10141b"/>
  <circle cx="30" cy="25" r="7" fill="#ff5f56"/>
  <circle cx="54" cy="25" r="7" fill="#ffbd2e"/>
  <circle cx="78" cy="25" r="7" fill="#27c93f"/>
  <rect x="150" y="18" width="200" height="14" rx="7" fill="#242c39"/>

  <!-- sidebar -->
  <rect x="90" y="95" width="60" height="275" rx="10" fill="#1c232f" stroke="#38424f"/>
  <g fill="#38424f">
    <rect x="104" y="115" width="32" height="10" rx="3" fill="#8ace25"/>
    <rect x="104" y="140" width="32" height="10" rx="3"/>
    <rect x="104" y="165" width="32" height="10" rx="3"/>
    <rect x="104" y="190" width="32" height="10" rx="3"/>
  </g>

  <!-- top mini cards -->
  <g>
    <rect x="175" y="95" width="130" height="50" rx="8" fill="#1c232f" stroke="#38424f"/>
    <rect x="315" y="95" width="130" height="50" rx="8" fill="#1c232f" stroke="#8ace25" stroke-width="2"/>
    <rect x="455" y="95" width="130" height="50" rx="8" fill="#1c232f" stroke="#38424f"/>
    <rect x="595" y="95" width="115" height="50" rx="8" fill="#1c232f" stroke="#38424f"/>
    <rect x="190" y="112" width="60" height="8" rx="2" fill="#38424f"/>
    <rect x="330" y="112" width="60" height="8" rx="2" fill="#8ace25"/>
    <rect x="470" y="112" width="60" height="8" rx="2" fill="#38424f"/>
    <rect x="610" y="112" width="60" height="8" rx="2" fill="#38424f"/>
  </g>

  <!-- bar chart -->
  <rect x="175" y="165" width="535" height="205" rx="10" fill="#1c232f" stroke="#38424f"/>
  <g fill="#ff7a33">
    <rect x="205" y="290" width="40" height="55" rx="3"/>
    <rect x="260" y="255" width="40" height="90" rx="3"/>
    <rect x="315" y="305" width="40" height="40" rx="3"/>
    <rect x="370" y="225" width="40" height="120" rx="3"/>
    <rect x="425" y="270" width="40" height="75" rx="3"/>
    <rect x="480" y="200" width="40" height="145" rx="3" fill="#8ace25"/>
    <rect x="535" y="245" width="40" height="100" rx="3"/>
  </g>
