    <path d="M268 215 a28 28 0 0 1 0 40"/>
    <path d="M288 198 a54 54 0 0 1 0 74"/>
  </g>

  <!-- central server/PBX box -->
  <rect x="340" y="175" width="120" height="120" rx="10" fill="#1c232f" stroke="#ff7a33" stroke-width="2"/>
  <g fill="#ff7a33">
    <rect x="360" y="200" width="80" height="10" rx="3"/>
    <rect x="360" y="220" width="60" height="10" rx="3"/>
    <rect x="360" y="240" width="70" height="10" rx="3"/>
