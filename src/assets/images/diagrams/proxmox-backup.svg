<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagrama de backup y replica off-site con Proxmox Backup Server">
  <rect width="800" height="450" rx="16" fill="#161c26"/>
  <rect width="800" height="50" rx="16" fill="#10141b"/>
  <rect y="34" width="800" height="16" fill="#10141b"/>
  <circle cx="30" cy="25" r="7" fill="#ff5f56"/>
  <circle cx="54" cy="25" r="7" fill="#ffbd2e"/>
  <circle cx="78" cy="25" r="7" fill="#27c93f"/>
  <rect x="150" y="18" width="200" height="14" rx="7" fill="#242c39"/>

  <!-- primary server -->
  <rect x="110" y="160" width="140" height="130" rx="10" fill="#1c232f" stroke="#38424f"/>
  <rect x="128" y="182" width="104" height="10" rx="3" fill="#8ace25"/>
  <rect x="128" y="200" width="104" height="10" rx="3" fill="#38424f"/>
  <rect x="128" y="218" width="104" height="10" rx="3" fill="#38424f"/>
  <rect x="128" y="236" width="70" height="10" rx="3" fill="#38424f"/>

  <!-- arrow -->
  <path d="M 270 225 H 400" stroke="#ff7a33" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ff7a33"/>
    </marker>
  </defs>

  <!-- backup cylinder -->
  <g transform="translate(430,160)">
    <path d="M0 15 a60 15 0 1 0 120 0 a60 15 0 1 0 -120 0" fill="#1c232f" stroke="#38424f"/>
    <path d="M0 15 v100 a60 15 0 0 0 120 0 v-100" fill="#1c232f" stroke="#38424f"/>
    <path d="M0 15 a60 15 0 0 0 120 0" fill="none" stroke="#38424f"/>
    <path d="M0 55 a60 15 0 0 0 120 0" fill="none" stroke="#38424f"/>
    <path d="M0 95 a60 15 0 0 0 120 0" fill="none" stroke="#38424f"/>
  </g>

  <!-- off-site replica, dashed line to small cylinder -->
  <path d="M 600 225 H 660" stroke="#8ace25" stroke-width="3" stroke-dasharray="5 5" fill="none" marker-end="url(#arrow2)"/>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8ace25"/>
    </marker>
  </defs>
  <g transform="translate(680,195)">
    <path d="M0 10 a30 8 0 1 0 60 0 a30 8 0 1 0 -60 0" fill="#1c232f" stroke="#8ace25"/>
    <path d="M0 10 v40 a30 8 0 0 0 60 0 v-40" fill="#1c232f" stroke="#8ace25"/>
  </g>

  <!-- clock icon representing RTO -->
  <g transform="translate(160,340)" stroke="#8b96a7" stroke-width="3" fill="none">
    <circle r="28"/>
    <path d="M0 -16 V0 L14 10"/>
  </g>
</svg>
