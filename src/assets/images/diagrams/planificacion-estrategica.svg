<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagrama de planificacion estrategica de TI por fases">
  <rect width="800" height="450" rx="16" fill="#161c26"/>
  <rect width="800" height="50" rx="16" fill="#10141b"/>
  <rect y="34" width="800" height="16" fill="#10141b"/>
  <circle cx="30" cy="25" r="7" fill="#ff5f56"/>
  <circle cx="54" cy="25" r="7" fill="#ffbd2e"/>
  <circle cx="78" cy="25" r="7" fill="#27c93f"/>
  <rect x="150" y="18" width="200" height="14" rx="7" fill="#242c39"/>

  <!-- ascending roadmap bars -->
  <g>
    <rect x="130" y="270" width="110" height="60" rx="6" fill="#1c232f" stroke="#38424f"/>
    <rect x="270" y="220" width="110" height="110" rx="6" fill="#1c232f" stroke="#38424f"/>
    <rect x="410" y="170" width="110" height="160" rx="6" fill="#1c232f" stroke="#ff7a33" stroke-width="2"/>
    <rect x="550" y="120" width="110" height="210" rx="6" fill="#1c232f" stroke="#8ace25" stroke-width="2"/>
  </g>

  <!-- milestone dots + connecting dashed line -->
  <path d="M 185 270 L 325 220 L 465 170 L 605 120" stroke="#8b96a7" stroke-width="2" stroke-dasharray="4 6" fill="none"/>
  <circle cx="185" cy="270" r="7" fill="#38424f"/>
  <circle cx="325" cy="220" r="7" fill="#38424f"/>
  <circle cx="465" cy="170" r="7" fill="#ff7a33"/>
  <circle cx="605" cy="120" r="7" fill="#8ace25"/>

  <!-- small bars inside each block representing checklist -->
  <g fill="#38424f">
    <rect x="145" y="285" width="80" height="8" rx="2"/>
    <rect x="285" y="245" width="80" height="8" rx="2"/>
    <rect x="285" y="263" width="80" height="8" rx="2"/>
    <rect x="425" y="195" width="80" height="8" rx="2"/>
    <rect x="425" y="213" width="80" height="8" rx="2"/>
    <rect x="425" y="231" width="80" height="8" rx="2"/>
    <rect x="565" y="145" width="80" height="8" rx="2" fill="#8ace25"/>
    <rect x="565" y="163" width="80" height="8" rx="2"/>
    <rect x="565" y="181" width="80" height="8" rx="2"/>
  </g>
</svg>
